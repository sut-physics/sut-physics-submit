# Auto-deploy frontend ขึ้น pb_public/ ของ Oracle VM เมื่อ push ไฟล์หน้าเว็บ
# PocketBase binary + pb_data (ข้อมูล) + pb_hooks อยู่บน VM เสมอ — workflow นี้แตะแค่ frontend
#
# key ที่ใช้ถูกล็อกไว้ฝั่ง VM ด้วย forced command (deploy/deploy-frontend.sh):
#   เข้า shell ไม่ได้ · sudo ไม่ได้ · อ่าน pb_data/ไฟล์แนบไม่ได้ · ทำได้อย่างเดียวคือเปลี่ยนไฟล์หน้าเว็บ
#   → secret หลุดก็ยังไม่เสียทั้งเครื่อง (ดูเหตุผลเต็มในหัวไฟล์ deploy/deploy-frontend.sh)
#
# ต้องตั้ง Secrets ใน repo (Settings → Secrets and variables → Actions):
#   VM_HOST     = public IP ของ VM
#   VM_USER     = deploy
#   VM_SSH_KEY  = private key ของคู่ `gh-deploy` (คนละดอกกับ key ที่คุณใช้ ssh เอง)
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}   # กดรันเองจากหน้า Actions ได้

concurrency:
  group: deploy-frontend  # กันสอง push ชนกันจนไฟล์ปนกัน
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # ปักหมุด host key ของ VM — ครั้งแรกเก็บจากเครื่องจริง แล้ว pin ไว้กัน MITM
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}

      - name: ส่ง frontend เข้า pb_public
        run: |
          tar -czf - index.html css js \
            | ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VM_USER@$VM_HOST"
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}

      - name: เช็คว่าเว็บยังขึ้นอยู่
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PB_URL/api/health")
          echo "health: $code"
          [ "$code" = "200" ]
        env:
          PB_URL: ${{ secrets.PB_URL }}
